on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - name: Stub package.json
        run: 'echo "{\"packageManager\": \"pnpm@11.28.2\"}" > package.json'
        
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Version before
        run: pnpm --version

      - name: Update
        run: pnpm self-update

      - name: Version after
        run: pnpm --version
      
